<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='image.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    
    <div class="card shadow mx-auto mt-5 bg-white bg-opacity-75 rounded-4 shadow-lg p-5 text-center" dir="rtl" style="max-width: 450px;">
        <div class="card-body p-4 text-center">
            <h2 class="card-title text-center mb-4">ورود دانشجویان</h2>
            <form method="POST">
                <input type="text" name="student_number" class="form-control mb-3" placeholder="شماره دانشجویی" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="رمز عبور" required>
                <button type="submit" class="btn btn-success w-50 center">ورود</button>
            </form>
            <p class="login-note text-muted text-center mt-3 mb-0">رمز عبور به صورت پیش‌فرض، کد ملی است</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <ul class="flash-error alert alert-danger mt-3">
                        {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}
        </div>
    </div>
    
</body>
</html>
