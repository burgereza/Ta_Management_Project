<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body dir="rtl" align-items="center">
    <div class="container py-4">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages alert alert-success mb-4">
                    {% for msg in messages %}
                        <p class="mb-1">{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="box card shadow-sm mb-4 p-4">
            <form method="POST">
                <div class="form-group">
                    <label>کد پرسنلی:</label>
                    <input type="text" name="personnel_code" class="form-control mb-3" placeholder="" required>
                    <label>نام و نام خانوادگی:</label>
                    <input type="text" name="professor_name" class="form-control mb-3" placeholder="" required>
                    <label>کد ملی:</label>
                    <input type="text" name="professor_password" class="form-control mb-3" placeholder="" required>
                </div>
                <button type="submit" name="add_professor" class="btn btn-green btn-success">افزودن استاد</button>
            </form>
        </div>

        <div class="box card shadow-sm mb-4 p-4">
            <form method="POST">
                <div class="form-group">
                    <label>شماره دانشجویی:</label>
                    <input type="text" name="student_number" class="form-control mb-3" placeholder="" required>
                    <label>نام و نام خانوادگی:</label>
                    <input type="text" name="student_name" class="form-control mb-3" placeholder="" required>
                    <label>کد ملی:</label>
                    <input type="text" name="student_password" class="form-control mb-3" placeholder="" required>
                </div>
                <button type="submit" name="add_student" class="btn btn-green btn-success">افزودن دانشجو</button>
            </form>
        </div>

        <div class="box card shadow-sm mb-4 p-4">
            <form method="POST">
                <div class="form-group">
                    <label>کد درس:</label>
                    <input type="text" name="course_code" class="form-control mb-3" placeholder="" required>
                    <label>نام درس:</label>
                    <input type="text" name="course_name" class="form-control mb-3" placeholder="" required>
                </div>
                <button type="submit" name="add_base_course" class="btn btn-green btn-success">افزودن درس</button>
            </form>
        </div>

    </div>
</body>
</html>
